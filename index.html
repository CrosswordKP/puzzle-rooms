.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 90% 4%,color-mix(in srgb,var(--accent) 34%,transparent) 0,transparent 42%),radial-gradient(circle at 6% 98%,rgba(99,102,241,.28) 0,transparent 50%)}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--head);font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
a{color:#C7D2FE}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:600;letter-spacing:.02em;color:var(--muted);font-size:14px}
.brand svg{flex:none}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 22px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-family:var(--head);font-weight:600;font-size:18px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:16px;min-height:46px}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-family:var(--head);font-weight:600;font-size:14px}
.tint{color:color-mix(in srgb,var(--accent) 45%,white)}
.stack{display:flex;flex-direction:column;gap:14px}
/* lobby */
.hero{text-align:center;padding:18px 0 6px}
.hero h1{font-size:34px}
.hero p{color:var(--muted);margin-top:4px}
.rooms{display:grid;gap:12px;margin-top:18px}
.room-btn{display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:var(--glass);min-height:84px;width:100%}
.room-btn .av{flex:none;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#fff 0,#E8E4FF 65%,#CBC3FF 100%);border:3px solid var(--c);overflow:hidden}
.room-btn .av img{width:58px;height:58px;display:block}
.room-btn b{display:block;font-family:var(--head);font-weight:600;font-size:19px}
.room-btn span{color:var(--muted);font-size:15px}
.room-btn .done{margin-left:auto;flex:none;font-family:var(--head);font-size:13px;color:var(--ok)}
/* room header */
.rhead{display:flex;align-items:center;gap:14px}
.portal{flex:none;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#fff 0,#E8E4FF 65%,#CBC3FF 100%);border:4px solid var(--accent);box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 24%,transparent),0 0 36px color-mix(in srgb,var(--accent) 55%,transparent);overflow:hidden}
.portal img{width:88px;height:88px;display:block}
.rhead h1{font-size:24px}
.rhead p{color:var(--muted);font-size:15px}
.steps{display:flex;gap:8px;margin-top:4px}
.steps i{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.14)}
.steps i.on{background:var(--accent)}
.steps i.now{background:color-mix(in srgb,var(--accent) 55%,transparent)}
.q{font-family:var(--head);font-weight:500;font-size:20px;line-height:1.35}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--warn-bg);color:#FDE68A;font-size:15px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:56px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);font-size:17px;line-height:1.45}
.opt .box{flex:none;width:26px;height:26px;margin-top:1px;border-radius:8px;border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center}
.opt.radio .box{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.opt[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.must{box-shadow:inset 0 0 0 2px var(--warn)}
.opt:disabled{opacity:.55;cursor:not-allowed}
.why{display:block;margin-top:4px;font-size:14.5px;color:var(--muted)}
.fb{padding:12px 14px;border-radius:14px;font-size:16px}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb.info{background:var(--warn-bg);border:1px solid var(--warn)}
.fb b{font-family:var(--head);font-weight:600}
/* letter */
.letter{margin:6px auto 0;width:150px;height:150px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:96px;color:var(--on-accent);background:var(--accent);box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 24%,transparent),0 0 70px color-mix(in srgb,var(--accent) 70%,transparent);animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.letter{animation:none}}
.center{text-align:center}
/* capsule */
.capsule{max-width:760px}
.teams{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.team{min-height:56px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);font-family:var(--head);font-weight:600;font-size:18px}
.team[aria-pressed="true"]{background:#F4F3FF;color:#0B1026;border-color:#F4F3FF}
.team.opened{border-color:var(--ok)}
.code{width:100%;min-height:72px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font:600 40px var(--head);letter-spacing:.5em;text-align:center;text-transform:uppercase;padding:8px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.log li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-size:16px}
.small{font-size:13.5px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 160px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

function brand(){ return '<div class="brand">' + ROCKET + '<span>ภารกิจตู้เวลา · ห้องปริศนา</span></div>'; }
function focusTop(){ window.scrollTo(0, 0); var h = app.querySelector("h1,h2"); if(h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); } }

/* ------------------------------------------------------------------ routing (#room-1 … #room-5, #capsule) */
function route(){
  var h = (location.hash || "").replace("#", "");
  var m = /^room-([1-5])$/.exec(h);
  if(m){ startRoom(parseInt(m[1], 10)); }
  else if(h === "capsule"){ capsule(); }
  else { lobby(); }
}
window.addEventListener("hashchange", route);

/* ------------------------------------------------------------------ lobby */
function lobby(){
  setAccent("#6366F1");
  var done = load("pr-done", {});
  var html = brand() + '<div class="hero"><h1>ห้องปริศนา</h1><p>เลือกห้องตามเลขบทบาทบนการ์ดของคุณ</p></div><div class="rooms">';
  ROOMS.forEach(function(r){
    html += '<a class="room-btn" style="--c:' + r.accent + ';text-decoration:none;color:inherit" href="#room-' + r.n + '">' +
      '<span class="av"><img alt="" src="' + AV[r.n - 1] + '"></span>' +
      '<span style="min-width:0"><b>ห้อง ' + r.n + ' · ' + esc(r.topic) + '</b><span>บทบาท ' + r.n + ' ' + esc(r.role) + '</span></span>' +
      (done[r.n] ? '<span class="done">ผ่านแล้ว</span>' : '') + '</a>';
  });
  html += '</div><p class="small center" style="margin-top:22px"><a href="#capsule">ตู้เวลา (เปิดที่เครื่องครูหน้าห้อง)</a></p>';
  app.innerHTML = html; focusTop();
}

/* ------------------------------------------------------------------ room flow */
var S;   /* current room state */
function startRoom(n){
  var r = ROOMS[n - 1]; setAccent(r.accent);
  var done = load("pr-done", {});
  S = { r:r, stage: done[n] ? 4 : 0, att:0, sel:{}, k:0, wrong:{}, seed: n * 7 + 3 };
  render();
}
function header(){
  var r = S.r, st = S.stage;
  var bars = [1,2,3].map(function(i){ return '<i class="' + (st > i ? "on" : (st === i ? "now" : "")) + '"></i>'; }).join("");
  return brand() + '<div class="rhead" style="margin-top:14px"><div class="portal"><img alt="อวตาร' + esc(r.role) + '" src="' + AV[r.n - 1] + '"></div>' +
    '<div style="min-width:0;flex:1"><span class="chip">ห้องปริศนาที่ ' + r.n + '</span><h1 style="margin-top:6px">' + esc(r.topic) + '</h1>' +
    '<p>บทบาท ' + r.n + ' ' + esc(r.role) + '</p>' + (st >= 1 && st <= 3 ? '<div class="steps" aria-label="ด่าน ' + st + ' จาก 3">' + bars + '</div>' : '') + '</div></div>';
}
function render(){
  var st = S.stage, h = header();
  if(st === 0) h += intro();
  else if(st === 1) h += stage1();
  else if(st === 2) h += stage2();
  else if(st === 3) h += stage3();
  else h += finish();
  app.innerHTML = h;
  bind();
}
function intro(){
  return '<div class="panel stack" style="margin-top:18px"><p class="q">ภารกิจของคุณ</p>' +
    '<p>ผ่าน 3 ด่านในห้องนี้ แล้วจะได้ <b>อักษรรหัส 1 ตัว</b> สำหรับเปิดตู้เวลาของทีม</p>' +
    '<p>ด่าน 1 ติ๊กให้ครบ · ด่าน 2 จับคู่เหตุผล · ด่าน 3 สรุปให้ถูก</p>' +
    '<p class="small">ตอบผิดได้ ระบบจะให้คำใบ้ ห้ามบอกคำตอบเพื่อนในห้องอื่น</p>' +
    '<button class="btn" data-act="go1">เริ่มด่าน 1</button></div>';
}
/* ---- stage 1 : tick all that apply */
function s1opts(){ return shuffle(S.r.s1.opts.map(function(o, i){ o.i = i; return o; }), S.seed); }
function stage1(){
  var s = S.r.s1, reveal = S.att >= 3, html = '<div class="stack" style="margin-top:18px"><p class="q">ด่าน 1 · ' + esc(s.q) + '</p>';
  if(S.att === 0) html += '<div class="note">' + PEN + '<span>ก่อนกดตรวจ เขียนเหตุผลสั้น ๆ 1 ข้อลงกระดาษโน้ตของตัวเอง</span></div>';
  html += '<div class="opts">';
  s1opts().forEach(function(o){
    var on = !!S.sel[o.i], cls = "opt";
    var extra = "";
    if(S.wrong[o.i]){ cls += " wrong"; extra = '<span class="why">ยังไม่ใช่ : ' + esc(o.why) + '</span>'; }
    if(reveal && o.ok){ cls += " must"; extra = '<span class="why">ข้อนี้ต้องติ๊ก : ' + esc(o.why) + '</span>'; }
    html += '<button class="' + cls + '" aria-pressed="' + on + '" data-tick="' + o.i + '"><span class="box">' + (on ? CHECK : "") + '</span><span>' + esc(o.t) + extra + '</span></button>';
  });
  html += '</div><div id="fb">' + (S.fb || "") + '</div><button class="btn" data-act="check1">ตรวจคำตอบ</button></div>';
  return html;
}
function check1(){
  var s = S.r.s1, good = 0, over = 0, miss = 0;
  s.opts.forEach(function(o, i){ var on = !!S.sel[i]; if(o.ok && on) good++; else if(!o.ok && on) over++; else if(o.ok && !on) miss++; });
  if(over === 0 && miss === 0){ S.stage = 2; S.k = 0; S.fb = ""; S.picked = null; S.tried = {}; render(); focusTop(); return; }
  S.att++;
  S.wrong = {};
  if(S.att === 1){
    S.fb = '<div class="fb bad"><b>ยังไม่ครบ</b> ถูก ' + good + ' ข้อ' + (over ? ' · ติ๊กเกิน ' + over + ' ข้อ' : '') + (miss ? ' · ยังขาด ' + miss + ' ข้อ' : '') + '<br>คำใบ้ : ' + esc(s.hint) + '</div>';
  } else if(S.att === 2){
    s.opts.forEach(function(o, i){ if(!o.ok && S.sel[i]) S.wrong[i] = true; });
    S.fb = '<div class="fb bad"><b>ใกล้แล้ว</b> ข้อที่มีกรอบสีแดงยังไม่ใช่' + (miss ? ' และยังขาดอีก ' + miss + ' ข้อ' : '') + '</div>';
  } else {
    s.opts.forEach(function(o, i){ if(!o.ok && S.sel[i]) S.wrong[i] = true; });
    S.fb = '<div class="fb info"><b>ดูเฉลย</b> ข้อที่มีกรอบสีเหลืองคือข้อที่ต้องติ๊ก ติ๊กให้ตรงแล้วกดตรวจอีกครั้ง</div>';
  }
  render();
  var f = document.getElementById("fb"); if(f) f.scrollIntoView({block:"nearest"});
}
/* ---- stage 2 : pick the reason, one item at a time */
function stage2(){
  var it = S.r.s2[S.k], html = '<div class="stack" style="margin-top:18px"><p class="small">ด่าน 2 · จับคู่เหตุผล ข้อ ' + (S.k + 1) + ' จาก 3</p><p class="q">' + esc(it.q) + '</p><div class="opts">';
  shuffle(it.opts.map(function(o, i){ o.i = i; return o; }), S.seed + S.k + 1).forEach(function(o){
    var cls = "opt radio", dis = "", note = "";
    if(S.tried[o.i]){ cls += " wrong"; dis = " disabled"; note = '<span class="why">' + esc(o.fb) + '</span>'; }
    if(S.picked === o.i && o.ok){ cls += " good"; note = '<span class="why">' + esc(o.fb) + '</span>'; }
    html += '<button class="' + cls + '"' + dis + ' data-pick="' + o.i + '"><span class="box"></span><span>' + esc(o.t) + note + '</span></button>';
  });
  html += '</div>';
  if(S.picked !== null && it.opts[S.picked].ok) html += '<button class="btn" data-act="next2">' + (S.k < 2 ? "ข้อต่อไป" : "ไปด่าน 3") + '</button>';
  return html + '</div>';
}
function pick2(i){
  var it = S.r.s2[S.k];
  if(S.picked !== null && it.opts[S.picked].ok) return;
  if(it.opts[i].ok){ S.picked = i; } else { S.tried[i] = true; }
  render();
}
function next2(){
  if(S.k < 2){ S.k++; S.picked = null; S.tried = {}; render(); }
  else { S.stage = 3; S.picked = null; S.tried = {}; render(); focusTop(); }
}
/* ---- stage 3 : choose the conclusion */
function stage3(){
  var s = S.r.s3, html = '<div class="stack" style="margin-top:18px"><p class="q">ด่าน 3 · ' + esc(s.q) + '</p><div class="opts">';
  shuffle(s.opts.map(function(o, i){ o.i = i; return o; }), S.seed + 11).forEach(function(o){
    var cls = "opt radio", dis = "", note = "";
    if(S.tried[o.i]){ cls += " wrong"; dis = " disabled"; note = '<span class="why">' + esc(o.fb) + '</span>'; }
    html += '<button class="' + cls + '"' + dis + ' data-pick3="' + o.i + '"><span class="box"></span><span>' + esc(o.t) + note + '</span></button>';
  });
  return html + '</div></div>';
}
function pick3(i){
  if(S.r.s3.opts[i].ok){ var d = load("pr-done", {}); d[S.r.n] = true; save("pr-done", d); S.stage = 4; render(); focusTop(); }
  else { S.tried[i] = true; render(); }
}
/* ---- finish : the letter */
function finish(){
  var r = S.r, concl = r.s3.opts.filter(function(o){ return o.ok; })[0].t;
  return '<div class="panel stack center" style="margin-top:18px"><p class="q">ผ่านครบ 3 ด่านแล้ว</p><p>อักษรรหัสของคุณคือ</p>' +
    '<div class="letter" aria-label="อักษร ' + L(r.key) + '">' + L(r.key) + '</div>' +
    '<p style="margin-top:14px"><b>จดอักษรนี้ไว้ ห้ามบอกเพื่อนห้องอื่น</b></p>' +
    '<div class="fb ok" style="text-align:left"><b>สิ่งที่คุณค้นพบ</b><br>' + esc(concl) + '</div>' +
    '<p>กลับไปที่ทีม เล่าห้องของคุณให้เพื่อนฟัง แล้วนำอักษรของทุกคนเรียงตามเลขบทบาท 1 ถึง 5 ไปเปิดตู้เวลาที่เครื่องครู</p>' +
    '<button class="btn ghost" data-act="again">' + (S.confirmAgain ? "แตะอีกครั้งเพื่อเริ่มห้องนี้ใหม่" : "เล่นห้องนี้ใหม่") + '</button></div>';
}
function again(){
  if(!S.confirmAgain){ S.confirmAgain = true; render(); return; }
  var d = load("pr-done", {}); delete d[S.r.n]; save("pr-done", d);
  S = { r:S.r, stage:0, att:0, sel:{}, k:0, wrong:{}, seed:S.seed }; render(); focusTop();
}
/* ---- events */
function bind(){
  app.onclick = function(e){
    var b = e.target.closest("button"); if(!b || b.disabled) return;
    if(b.hasAttribute("data-tick")){ var i = +b.getAttribute("data-tick"); S.sel[i] = !S.sel[i]; if(S.wrong[i] && !S.sel[i]) delete S.wrong[i]; render(); var nb = app.querySelector('[data-tick="' + i + '"]'); if(nb) nb.focus(); return; }
    if(b.hasAttribute("data-pick")){ pick2(+b.getAttribute("data-pick")); return; }
    if(b.hasAttribute("data-pick3")){ pick3(+b.getAttribute("data-pick3")); return; }
    var a = b.getAttribute("data-act");
    if(a === "go1"){ S.stage = 1; S.fb = ""; render(); focusTop(); }
    else if(a === "check1") check1();
    else if(a === "next2") next2();
    else if(a === "again") again();
  };
}

/* ------------------------------------------------------------------ time capsule (teacher's machine) */
var C = { team:0, msg:"", clear:false };
function capsule(){
  setAccent("#6366F1");
  var opened = load("pr-capsule", []);
  var html = '<div class="capsule stack" style="margin:0 auto">' + brand() +
    '<div class="center"><h1 style="font-size:36px">ตู้เวลา</h1><p class="small" style="margin-top:4px">ใส่รหัส 5 ตัวอักษร เรียงตามเลขบทบาท 1 ถึง 5</p></div>' +
    '<div class="panel stack"><p class="q">1 · เลือกทีม</p><div class="teams">';
  for(var t = 1; t <= 5; t++){
    var isOpen = opened.some(function(o){ return o.team === t; });
    html += '<button class="team' + (isOpen ? " opened" : "") + '" aria-pressed="' + (C.team === t) + '" data-team="' + t + '">ทีม ' + t + '</button>';
  }
  html += '</div><label class="q" for="code">2 · ใส่รหัส</label>' +
    '<input id="code" class="code" type="password" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="5" aria-describedby="cmsg">' +
    '<button class="btn" data-act="open">เปิดตู้เวลา</button><div id="cmsg">' + C.msg + '</div></div>';
  html += '<div class="panel stack"><p class="q">ทีมที่กลับสู่ปัจจุบันแล้ว</p>';
  if(opened.length){
    html += '<ol class="log">' + opened.map(function(o, i){ return '<li><span>' + (i + 1) + '. ทีม ' + o.team + '</span><span>' + esc(o.time) + '</span></li>'; }).join("") + '</ol>';
    html += '<button class="btn ghost" data-act="clear">' + (C.clear ? "แตะอีกครั้งเพื่อล้างรายการ" : "ล้างรายการ (เริ่มคาบใหม่)") + '</button>';
  } else html += '<p class="small">ยังไม่มีทีมใดเปิดตู้เวลา</p>';
  html += '</div><p class="small center"><a href="#">กลับหน้าห้องปริศนา</a></p></div>';
  app.innerHTML = html;
  var inp = document.getElementById("code");
  inp.addEventListener("keydown", function(e){ if(e.key === "Enter") tryOpen(); });
  app.onclick = function(e){
    var b = e.target.closest("button"); if(!b) return;
    if(b.hasAttribute("data-team")){ C.team = +b.getAttribute("data-team"); C.msg = ""; capsule(); document.getElementById("code").focus(); return; }
    var a = b.getAttribute("data-act");
    if(a === "open") tryOpen();
    else if(a === "clear"){ if(!C.clear){ C.clear = true; capsule(); return; } save("pr-capsule", []); C.clear = false; C.msg = ""; capsule(); }
  };
}
function tryOpen(){
  var inp = document.getElementById("code"), v = (inp.value || "").trim().toUpperCase();
  if(!C.team){ C.msg = '<div class="fb info">เลือกทีมก่อน</div>'; capsule(); return; }
  if(v === CODE){
    var opened = load("pr-capsule", []);
    if(!opened.some(function(o){ return o.team === C.team; })){
      var d = new Date(); opened.push({ team:C.team, time:("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2) + ":" + ("0" + d.getSeconds()).slice(-2) });
      save("pr-capsule", opened);
    }
    C.msg = '<div class="fb ok center" style="font-size:22px"><b>ทีม ' + C.team + ' เปิดตู้เวลาสำเร็จ</b><br>กลับสู่ปัจจุบันแล้ว รับชุดภารกิจสุดท้ายจากครูได้เลย</div>';
    C.team = 0; capsule();
  } else {
    C.msg = '<div class="fb bad center"><b>รหัสยังไม่ถูก</b> ตรวจลำดับอักษรตามเลขบทบาทอีกครั้ง</div>';
    capsule();
    var p = document.getElementById("code"); p.classList.add("shake"); p.focus();
  }
}

route();
})();
</script>

</body>
</html>
