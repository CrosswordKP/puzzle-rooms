.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 90% 4%,color-mix(in srgb,var(--accent) 34%,transparent) 0,transparent 42%),radial-gradient(circle at 6% 98%,rgba(99,102,241,.28) 0,transparent 50%)}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--head);font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
a{color:#C7D2FE}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:600;letter-spacing:.02em;color:var(--muted);font-size:14px}
.brand svg{flex:none}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 22px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-family:var(--head);font-weight:600;font-size:18px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:16px;min-height:46px}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-family:var(--head);font-weight:600;font-size:14px}
.tint{color:color-mix(in srgb,var(--accent) 45%,white)}
.stack{display:flex;flex-direction:column;gap:14px}
/* lobby */
.hero{text-align:center;padding:18px 0 6px}
.hero h1{font-size:34px}
.hero p{color:var(--muted);margin-top:4px}
.rooms{display:grid;gap:12px;margin-top:18px}
.room-btn{display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:var(--glass);min-height:84px;width:100%}
.room-btn .av{flex:none;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#fff 0,#E8E4FF 65%,#CBC3FF 100%);border:3px solid var(--c);overflow:hidden}
.room-btn .av img{width:58px;height:58px;display:block}
.room-btn b{display:block;font-family:var(--head);font-weight:600;font-size:19px}
.room-btn span{color:var(--muted);font-size:15px}
.room-btn .done{margin-left:auto;flex:none;font-family:var(--head);font-size:13px;color:var(--ok)}
/* room header */
.rhead{display:flex;align-items:center;gap:14px}
.portal{flex:none;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#fff 0,#E8E4FF 65%,#CBC3FF 100%);border:4px solid var(--accent);box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 24%,transparent),0 0 36px color-mix(in srgb,var(--accent) 55%,transparent);overflow:hidden}
.portal img{width:88px;height:88px;display:block}
.rhead h1{font-size:24px}
.rhead p{color:var(--muted);font-size:15px}
.steps{display:flex;gap:8px;margin-top:4px}
.steps i{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.14)}
.steps i.on{background:var(--accent)}
.steps i.now{background:color-mix(in srgb,var(--accent) 55%,transparent)}
.q{font-family:var(--head);font-weight:500;font-size:20px;line-height:1.35}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--warn-bg);color:#FDE68A;font-size:15px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:56px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);font-size:17px;line-height:1.45}
.opt .box{flex:none;width:26px;height:26px;margin-top:1px;border-radius:8px;border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center}
.opt.radio .box{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.opt[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.must{box-shadow:inset 0 0 0 2px var(--warn)}
.opt:disabled{opacity:.55;cursor:not-allowed}
.opt.wrong:disabled{opacity:1}
.opt.wrong:disabled > span:last-child{color:var(--muted)}
.opt.wrong .why{color:#FECDD3}
.why{display:block;margin-top:4px;font-size:14.5px;color:var(--muted)}
.fb{padding:12px 14px;border-radius:14px;font-size:16px}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb.info{background:var(--warn-bg);border:1px solid var(--warn)}
.fb b{font-family:var(--head);font-weight:600}
/* letter */
.letter{margin:6px auto 0;width:150px;height:150px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:96px;color:var(--on-accent);background:var(--accent);box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 24%,transparent),0 0 70px color-mix(in srgb,var(--accent) 70%,transparent);animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.letter{animation:none}}
.center{text-align:center}
/* capsule */
.capsule{max-width:760px}
.teams{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.team{min-height:56px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);font-family:var(--head);font-weight:600;font-size:18px}
.team[aria-pressed="true"]{background:#F4F3FF;color:#0B1026;border-color:#F4F3FF}
.team.opened{border-color:var(--ok)}
.code{width:100%;min-height:72px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font:600 40px var(--head);letter-spacing:.5em;text-align:center;text-transform:uppercase;padding:8px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.log li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-size:16px}
.small{font-size:13.5px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 160px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* v3 task types */
.lead{color:var(--muted);font-size:16px}
.plan{margin:0;padding-left:20px;display:grid;gap:4px}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);font-size:17px;line-height:1.45}
.card.pick{flex-direction:row;align-items:flex-start;gap:12px;min-height:52px}
.card.pick[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:0 0 0 2px var(--accent)}
.card.good{border-color:var(--ok);background:var(--ok-bg)}
.card.wrong{border-color:var(--bad);background:var(--bad-bg)}
.card:disabled{cursor:default}
.card .ct{min-width:0;flex:1}
.card .why{display:block;margin-top:4px;font-size:14.5px;color:#FECDD3}
.card.good .why{color:#A7F3D0}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:600;font-size:15px}
.num.empty{background:transparent;border:2px dashed rgba(255,255,255,.35)}
.pairto{display:block;margin-top:2px;font-size:14.5px;color:var(--muted)}
.bins{display:flex;flex-wrap:wrap;gap:8px}
.bin{flex:1 1 0;min-width:0;min-height:44px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);font-family:var(--head);font-weight:500;font-size:15px;line-height:1.3}
.bin[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bin.big{min-height:60px;font-size:20px}
.bin.wrong{border-color:var(--bad);background:var(--bad-bg);opacity:.8}
.bin.good{background:var(--ok);border-color:var(--ok);color:#0B1026;opacity:1}
.bin:disabled{cursor:default}
.sentence{font-size:18px;line-height:2.2}
.blank{display:inline-block;min-width:110px;margin:0 3px;padding:2px 12px;border-radius:10px;border:0;border-bottom:2.5px dashed rgba(255,255,255,.6);background:rgba(255,255,255,.08);font-size:17px;line-height:1.6;vertical-align:baseline}
.blank.cur{border-bottom-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:0 0 0 2px var(--accent)}
.blank.wrong{border-bottom-color:var(--bad);background:var(--bad-bg)}
.blank.good{border-bottom-color:var(--ok);background:var(--ok-bg)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.word{min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.08);font-size:16px}
.word:disabled{opacity:.3}
.notes{margin:0;padding-left:20px;color:#FECDD3;font-size:15px;display:grid;gap:4px}
.seq{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slot.empty{display:flex;align-items:center;gap:12px;min-height:52px;padding:12px 14px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.25)}
.claim{font-family:var(--head);font-size:19px;line-height:1.45}
.numrow{display:flex;align-items:center;gap:12px}
.numin{flex:1;min-width:0;min-height:60px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font:600 28px var(--head);text-align:center;padding:6px}
.numin:focus{border-color:var(--accent);outline:none}
.unit{font-family:var(--head);font-size:18px}

/* setup picker */
.setup{display:grid;gap:8px;padding:12px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.pickgrid{display:grid;gap:8px}
.pickgrid.sets{grid-template-columns:repeat(5,minmax(0,1fr))}
.pickgrid.teams5{grid-template-columns:repeat(5,minmax(0,1fr))}
.pickgrid .bin{padding:8px 4px}
.btn:disabled{opacity:.45}
/* TV board */
body.tvmode .wrap{max-width:1680px}
.tvwrap{display:grid;gap:16px}
.tvbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tvtitle{font-size:clamp(28px,3.2vw,52px);flex:1;text-align:center}
.tvctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.setsel{min-height:44px;min-width:72px;border-radius:12px;border:1.5px solid var(--line);background:#1B1747;color:#fff;font:600 20px var(--head);padding:4px 10px}
.live{font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:10px;height:10px;border-radius:50%;background:#6B7280}
.live.ok::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.live.err::before{background:var(--bad)}
.live.wait::before{background:var(--warn)}
.tvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.tcard{background:var(--glass);border:1.5px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:10px;align-content:start}
.tcard.open{border-color:var(--ok);background:linear-gradient(160deg,rgba(52,211,153,.22),rgba(52,211,153,.06));box-shadow:0 0 30px rgba(52,211,153,.35)}
.thead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.thead h2{font-size:clamp(24px,2.2vw,36px)}
.tpct{font:600 clamp(20px,1.8vw,30px) var(--head);color:var(--muted)}
.tbadge{font:600 15px var(--head);background:var(--ok);color:#0B1026;padding:4px 10px;border-radius:999px}
.tbar,.rbar{height:12px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.tbar i,.rbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#818CF8,#C084FC);transition:width .6s ease}
.tcard.open .tbar i{background:var(--ok)}
.roles{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rl{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;row-gap:4px;align-items:center}
.rn{grid-row:1 / span 2;width:30px;height:30px;border-radius:50%;background:var(--rc);color:#0B1026;display:flex;align-items:center;justify-content:center;font:600 16px var(--head)}
.rt{font:500 clamp(14px,1.05vw,17px) var(--head);display:flex;justify-content:space-between;align-items:baseline;gap:6px;min-width:0;white-space:nowrap}
.rt > span.rname{overflow:hidden;text-overflow:ellipsis;min-width:0}
.rs{color:var(--muted);font-weight:400;white-space:nowrap}
.rl .rbar{height:8px}
.rl .rbar i{background:var(--rc)}
.rl.fin .rs{color:var(--ok)}
.tsum{font:500 18px var(--head);color:var(--muted)}
.tvcode{display:grid;gap:10px}
.tvcode-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) auto;gap:12px;align-items:center}
.tvcode .code{min-height:60px;font-size:32px}
@media (max-width:820px){.tvcode-row{grid-template-columns:1fr}}
.tvfoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tvfoot .btn{width:auto;min-height:40px;font-size:14px;padding:8px 14px}
.burst{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(5,8,25,.78);padding:16px}
.burst[hidden]{display:none}
.bcard{text-align:center;padding:40px 56px;border-radius:32px;background:linear-gradient(160deg,#10B981,#059669);color:#04130D;box-shadow:0 0 0 12px rgba(52,211,153,.25),0 0 120px rgba(52,211,153,.6);animation:pop .7s ease-out}
.brocket svg{width:72px;height:72px}
.bt{font:700 clamp(48px,7vw,110px)/1.1 var(--head)}
.bs{font:600 clamp(22px,2.6vw,40px) var(--head)}
.bcard .small{color:#04261A;font-size:18px}
@media (prefers-reduced-motion:reduce){.bcard{animation:none}}

@media (min-width:1200px){
  body.tvmode .wrap{padding-block:2vh 2vh}
  .tvwrap{gap:2vh;min-height:94vh;grid-template-rows:auto 1fr auto auto}
  .tcard{padding:2.2vh 1.2vw;gap:1.6vh}
  .thead h2{font-size:clamp(28px,2.8vw,54px)}
  .tpct{font-size:clamp(22px,2.2vw,40px)}
  .tbar{height:16px}
  .roles{gap:2vh}
  .rn{width:clamp(30px,2.3vw,44px);height:clamp(30px,2.3vw,44px);font-size:clamp(16px,1.3vw,22px)}
  .rt{font-size:clamp(15px,1.02vw,21px)}
  .rl .rbar{height:10px}
  .tsum{font-size:clamp(18px,1.6vw,30px)}
  .tvcode .code{min-height:72px;font-size:40px}
  .tvcode .team{min-height:72px;font-size:24px}
  .tvcode .btn{min-height:72px;font-size:24px}
  .tbadge{font-size:clamp(14px,1.1vw,20px)}
}
</style>
</head>

function load(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }

/* ------------------------------------------------------------------ helpers */
var app = document.getElementById("app");
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function shuffle(a, seed){ var r = seed || 1, b = a.slice(); for(var i = b.length - 1; i > 0; i--){ r = (r * 9301 + 49297) % 233280; var j = Math.floor(r / 233280 * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; } return b; }
function setAccent(c){ document.documentElement.style.setProperty("--accent", c); }
function brand(){ return '<div class="brand">' + ROCKET + '<span>ภารกิจตู้เวลา · ห้องปริศนา</span></div>'; }

/* ------------------------------------------------------------------ routing (#room-1 … #room-5, #capsule) */

/* ------------------------------------------------------------------ room flow (v3: mixed task types) */
var S;
var DONE_KEY = "pr3-done";
function startRoom(n){
  var r = ROOMS[n - 1]; setAccent(r.accent);
  var done = load(DONE_KEY, {});
  var su = load(SETUP_KEY, null); if(!su || su.date !== today()) su = { set:0, team:0, date:today() };
  if(done[n] && done[n].set){ su = { set:done[n].set, team:done[n].team, date:today() }; }
  S = { r:r, stage: done[n] ? 4 : 0, t:0, seed: n * 7 + 3, st:null, confirmAgain:false, su:su, chg:false };
  if(S.stage >= 1 && S.stage <= 3) initTask();
  app.onclick = roomClick; app.oninput = roomInput; app.onkeydown = roomKey;
  render();
}
function tasks(){ return S.r.stages[S.stage - 1].tasks; }
function task(){ return tasks()[S.t]; }
function tseed(){ return S.seed + S.stage * 100 + S.t * 7; }
function initTask(){
  var k = task(), st = { a:0, fb:"", done:false };
  if(k.type === "sort"){ st.pick = {}; st.bad = {}; st.order = shuffle(k.items.map(function(_, i){ return i; }), tseed()); }
  else if(k.type === "match"){ st.sel = 0; st.pair = {}; st.bad = {}; st.ok = {}; st.order = shuffle(k.right.map(function(_, i){ return i; }), tseed()); }
  else if(k.type === "cloze"){ st.fill = {}; st.bad = {}; st.cur = 0; st.order = shuffle(k.bank.map(function(_, i){ return i; }), tseed()); }
  else if(k.type === "order"){ st.seq = []; st.bad = -1; st.order = shuffle(k.steps.map(function(_, i){ return i; }), tseed()); }
  else if(k.type === "tf2"){ st.phase = 0; st.tfTried = {}; st.tried = {}; st.picked = null; st.order = shuffle(k.reasons.map(function(_, i){ return i; }), tseed()); }
  else if(k.type === "spot"){ st.pick = {}; st.bad = {}; }
  else if(k.type === "num"){ st.val = ""; st.tries = 0; }
  else if(k.type === "mc"){ st.tried = {}; st.picked = null; st.order = shuffle(k.opts.map(function(_, i){ return i; }), tseed()); }
  S.st = st;
}
var TYPE_NAME = { sort:"คัดแยก", match:"จับคู่", cloze:"เติมคำ", order:"เรียงลำดับ", tf2:"ถูกหรือผิด เพราะอะไร", spot:"จับผิด", num:"คำนวณ", mc:"เลือกคำตอบ" };
function header(){
  var r = S.r, st = S.stage;
  var bars = [1,2,3].map(function(i){ return '<i class="' + (st > i ? "on" : (st === i ? "now" : "")) + '"></i>'; }).join("");
  return brand() + '<div class="rhead" style="margin-top:14px"><div class="portal"><img alt="อวตาร' + esc(r.role) + '" src="' + AV[r.n - 1] + '"></div>' +
    '<div style="min-width:0;flex:1"><span class="chip">ห้องปริศนาที่ ' + r.n + '</span><h1 style="margin-top:6px">' + esc(r.topic) + '</h1>' +
    '<p>บทบาท ' + r.n + ' ' + esc(r.role) + '</p>' + (st >= 1 && st <= 3 ? '<div class="steps" aria-label="ด่าน ' + st + ' จาก 3">' + bars + '</div>' : '') + '</div></div>';
}
function render(){
  var h = header();
  if(S.stage === 0) h += intro();
  else if(S.stage <= 3) h += taskView();
  else h += finish();
  app.innerHTML = h;
}
function intro(){
  var html = '<div class="panel stack" style="margin-top:18px"><p class="q">ภารกิจของคุณ</p>' +
    '<p>ผ่าน 3 ด่านในห้องนี้ แล้วจะได้ <b>อักษรรหัส 1 ตัว</b> สำหรับเปิดตู้เวลาของทีม</p><ol class="plan">';
  S.r.stages.forEach(function(sg, i){
    var kinds = []; sg.tasks.forEach(function(k){ var nm = k.kind || TYPE_NAME[k.type]; if(kinds.indexOf(nm) < 0) kinds.push(nm); });
    var kj = kinds.join(" · ");
    html += '<li><b>ด่าน ' + (i + 1) + '</b> ' + esc(sg.label) + (kj !== sg.label ? ' <span class="small">(' + kj + ')</span>' : '') + '</li>';
  });
  var ready = S.su.set && S.su.team;
  return html + '</ol><p class="small">อ่านให้ครบก่อนตอบ บางข้อเป็นกับดัก ตอบผิดได้ ระบบจะบอกเหตุผล ห้ามบอกคำตอบเพื่อนห้องอื่น</p>' +
    setupPicker() +
    '<button class="btn" data-x="start"' + (ready ? '' : ' disabled') + '>' + (ready ? 'เริ่มด่าน 1' : 'เลือกชุดรหัสและทีมก่อน') + '</button></div>';
}
function setupPicker(){
  var html = '<div class="setup"><p class="q" style="font-size:17px">ชุดรหัสที่ครูบอก</p><div class="pickgrid sets">';
  for(var i = 1; i <= SETS_ENC.length; i++) html += '<button class="bin" aria-pressed="' + (S.su.set === i) + '" data-x="pset" data-v="' + i + '">' + i + '</button>';
  html += '</div><p class="q" style="font-size:17px">ทีมของฉัน</p><div class="pickgrid teams5">';
  for(var j = 1; j <= 5; j++) html += '<button class="bin" aria-pressed="' + (S.su.team === j) + '" data-x="pteam" data-v="' + j + '">ทีม ' + j + '</button>';
  return html + '</div></div>';
}
function totalTasks(){ var n = 0; S.r.stages.forEach(function(sg){ n += sg.tasks.length; }); return n; }
function doneTasks(){ var n = 0; for(var s = 0; s < S.stage - 1; s++) n += S.r.stages[s].tasks.length; return n + S.t; }
function wrongCount(st){ if(!st) return 0; if(st.tries !== undefined) return st.tries; var n = st.a || 0; if(st.tried) for(var i in st.tried) n++; if(st.tfTried) for(var j in st.tfTried) n++; return n; }
function send(ev, extra){
  var p = { ev:ev, set:S.su.set, team:S.su.team, role:S.r.n, stage:Math.min(S.stage, 4), task:S.t, done:0, total:totalTasks(), att:0 };
  for(var k in extra) p[k] = extra[k];
  report(p);
}
function taskView(){
  var k = task(), sg = S.r.stages[S.stage - 1], st = S.st;
  var html = '<div class="stack" style="margin-top:18px"><p class="small">ด่าน ' + S.stage + ' · ' + esc(sg.label) + ' · ' + (k.kind || TYPE_NAME[k.type]) + ' · ข้อ ' + (S.t + 1) + ' จาก ' + sg.tasks.length + '</p>';
  if(k.lead) html += '<p class="lead">' + esc(k.lead) + '</p>';
  html += '<p class="q">' + esc(k.q) + '</p>';
  if(k.type === "sort") html += vSort(k, st);
  else if(k.type === "match") html += vMatch(k, st);
  else if(k.type === "cloze") html += vCloze(k, st);
  else if(k.type === "order") html += vOrder(k, st);
  else if(k.type === "tf2") html += vTf2(k, st);
  else if(k.type === "spot") html += vSpot(k, st);
  else if(k.type === "num") html += vNum(k, st);
  else if(k.type === "mc") html += vMc(k, st);
  html += '<div id="fb">' + st.fb + '</div>';
  if(st.done) html += '<button class="btn" data-x="next">' + nextLabel() + '</button>';
  else if(["sort","match","cloze","order","spot","num"].indexOf(k.type) >= 0) html += '<button class="btn" data-x="check">ตรวจคำตอบ</button>';
  return html + '</div>';
}
function nextLabel(){
  if(S.t < tasks().length - 1) return "ข้อต่อไป";
  return S.stage < 3 ? "ไปด่าน " + (S.stage + 1) : "รับอักษรรหัส";
}
function okBox(msg){ return '<div class="fb ok"><b>ถูกต้อง</b>' + (msg ? ' ' + esc(msg) : '') + '</div>'; }
/* shared escalation for tasks with several parts: 1 = count + hint, 2 = mark wrong parts with reasons, 3+ = also show the answer */
function escalate(k, st, right, total){
  st.a++;
  if(st.a === 1) return '<div class="fb bad"><b>ยังไม่ครบ</b> ถูก ' + right + ' จาก ' + total + (k.hint ? '<br>คำใบ้ : ' + esc(k.hint) : '') + '</div>';
  if(st.a === 2) return '<div class="fb bad"><b>ใกล้แล้ว</b> ข้อที่มีกรอบสีแดงยังไม่ใช่ อ่านเหตุผลแล้วแก้ใหม่</div>';
  return '<div class="fb info"><b>ดูเฉลย</b> ข้อที่มีกรอบสีแดงมีคำตอบที่ถูกบอกไว้ แก้ให้ตรงแล้วกดตรวจอีกครั้ง</div>';
}

/* ---- sort : put every card in a box */
function vSort(k, st){
  var html = '<div class="opts">';
  st.order.forEach(function(i){
    var it = k.items[i], bad = st.bad[i], note = "";
    if(bad){ note = '<span class="why">ยังไม่ใช่ : ' + esc(it.why) + (st.a >= 3 ? ' (ควรอยู่ “' + esc(k.bins[it.bin]) + '”)' : '') + '</span>'; }
    if(st.done && it.why2) note = '<span class="why">' + esc(it.why2) + '</span>';
    html += '<div class="card' + (bad ? ' wrong' : '') + (st.done ? ' good' : '') + '"><span class="ct">' + esc(it.t) + note + '</span><div class="bins">';
    k.bins.forEach(function(b, j){
      html += '<button class="bin" aria-pressed="' + (st.pick[i] === j) + '"' + (st.done ? ' disabled' : '') + ' data-x="sort" data-i="' + i + '" data-v="' + j + '">' + esc(b) + '</button>';
    });
    html += '</div></div>';
  });
  return html + '</div>';
}
function checkSort(k, st){
  var miss = k.items.filter(function(_, i){ return st.pick[i] === undefined; }).length;
  if(miss){ st.fb = '<div class="fb info">ยังจัดไม่ครบ อีก ' + miss + ' ข้อ</div>'; return; }
  var wrong = []; k.items.forEach(function(it, i){ if(st.pick[i] !== it.bin) wrong.push(i); });
  if(!wrong.length){ st.done = true; st.bad = {}; st.fb = okBox(k.ok || "จัดถูกครบทุกข้อ"); return; }
  st.fb = escalate(k, st, k.items.length - wrong.length, k.items.length);
  st.bad = {}; if(st.a >= 2) wrong.forEach(function(i){ st.bad[i] = true; });
}

/* ---- match : tap a left item, then its partner */
function vMatch(k, st){
  var html = '<p class="small">แตะข้อที่มีตัวเลข แล้วแตะคู่ของมันด้านล่าง (มีตัวหลอก 1 ข้อที่ไม่ต้องใช้)</p><div class="opts">';
  k.left.forEach(function(l, i){
    var p = st.pair[i], cls = "card pick", note = "";
    if(st.ok[i]) cls += " good";
    if(st.bad[i]){ cls += " wrong"; note = '<span class="why">ยังไม่ใช่ : ' + esc(k.right[p].why) + (st.a >= 3 ? ' (คู่ที่ถูก : ' + esc(k.right.filter(function(r){ return r.key === l.key; })[0].t) + ')' : '') + '</span>'; }
    html += '<button class="' + cls + '" aria-pressed="' + (st.sel === i) + '"' + (st.ok[i] || st.done ? ' disabled' : '') + ' data-x="ml" data-i="' + i + '"><span class="num">' + (i + 1) + '</span><span class="ct">' + esc(l.t) +
      '<span class="pairto">' + (p !== undefined ? '→ ' + esc(k.right[p].t) : 'ยังไม่จับคู่') + '</span>' + note + '</span></button>';
  });
  html += '</div><p class="small" style="margin-top:4px">คู่ของมัน</p><div class="opts">';
  st.order.forEach(function(j){
    var who = null; for(var i in st.pair){ if(st.pair[i] === j) who = +i; }
    var locked = who !== null && st.ok[who];
    html += '<button class="card pick right"' + (locked || st.done ? ' disabled' : '') + ' data-x="mr" data-i="' + j + '">' + (who !== null ? '<span class="num">' + (who + 1) + '</span>' : '<span class="num empty"></span>') + '<span class="ct">' + esc(k.right[j].t) + '</span></button>';
  });
  return html + '</div>';
}
function matchLeft(i){ var st = S.st; if(st.ok[i]) return; st.sel = i; render(); }
function matchRight(j){
  var st = S.st, k = task();
  var who = null; for(var i in st.pair){ if(st.pair[i] === j) who = +i; }
  if(st.sel === null){ if(who !== null && !st.ok[who]) st.sel = who; render(); return; }
  if(who !== null && who !== st.sel){ if(st.ok[who]) return; delete st.pair[who]; delete st.bad[who]; }
  st.pair[st.sel] = j; delete st.bad[st.sel];
  var next = null; for(var n = 0; n < k.left.length; n++){ if(st.pair[n] === undefined && !st.ok[n]){ next = n; break; } }
  st.sel = next; render();
}
function checkMatch(k, st){
  var miss = k.left.filter(function(_, i){ return st.pair[i] === undefined; }).length;
  if(miss){ st.fb = '<div class="fb info">ยังจับคู่ไม่ครบ อีก ' + miss + ' ข้อ</div>'; return; }
  var wrong = [];
  k.left.forEach(function(l, i){ if(k.right[st.pair[i]].key === l.key) st.ok[i] = true; else wrong.push(i); });
  if(!wrong.length){ st.done = true; st.bad = {}; st.sel = null; st.fb = okBox(k.ok || "จับคู่ถูกครบทุกคู่"); return; }
  st.fb = escalate(k, st, k.left.length - wrong.length, k.left.length);
  st.bad = {}; if(st.a >= 2) wrong.forEach(function(i){ st.bad[i] = true; });
  st.sel = wrong[0];
}

/* ---- cloze : tap a blank, then a word from the bank */
function blanks(k){ return k.parts.filter(function(p){ return typeof p !== "string"; }); }
function vCloze(k, st){
  var html = '<div class="panel sentence">', b = 0;
  k.parts.forEach(function(p){
    if(typeof p === "string"){ html += esc(p); return; }
    var i = b++, f = st.fill[i], cls = "blank";
    if(st.cur === i && !st.done) cls += " cur";
    if(st.bad[i]) cls += " wrong";
    if(st.done) cls += " good";
    html += '<button class="' + cls + '"' + (st.done ? ' disabled' : '') + ' data-x="blank" data-i="' + i + '">' + (f !== undefined ? esc(k.bank[f].t) : 'แตะเลือกคำ') + '</button>';
  });
  html += '</div>';
  var notes = "";
  blanks(k).forEach(function(p, i){
    if(!st.bad[i]) return;
    var w = k.bank[st.fill[i]];
    notes += '<li>ช่องที่ ' + (i + 1) + ' “' + esc(w.t) + '” ยังไม่ใช่ : ' + esc(w.fb || "คำนี้ถูก แต่ใช้ในช่องอื่น") + (st.a >= 3 ? ' (คำที่ถูก : ' + esc(p.a) + ')' : '') + '</li>';
  });
  if(notes) html += '<ul class="notes">' + notes + '</ul>';
  if(!st.done){
    html += '<p class="small">คลังคำ (มีคำหลอกปนอยู่)</p><div class="bank">';
    var used = {}; for(var x in st.fill) used[st.fill[x]] = true;
    st.order.forEach(function(j){ html += '<button class="word"' + (used[j] ? ' disabled' : '') + ' data-x="word" data-i="' + j + '">' + esc(k.bank[j].t) + '</button>'; });
    html += '</div>';
  }
  return html;
}
function clozeBlank(i){ var st = S.st; if(st.fill[i] !== undefined){ delete st.fill[i]; delete st.bad[i]; } st.cur = i; render(); }
function clozeWord(j){
  var st = S.st, k = task(), n = blanks(k).length;
  if(st.cur === null || st.cur === undefined) return;
  st.fill[st.cur] = j; delete st.bad[st.cur];
  var next = null; for(var c = 0; c < n; c++){ var ix = (st.cur + 1 + c) % n; if(st.fill[ix] === undefined){ next = ix; break; } }
  st.cur = next; render();
}
function checkCloze(k, st){
  var bl = blanks(k), miss = bl.filter(function(_, i){ return st.fill[i] === undefined; }).length;
  if(miss){ st.fb = '<div class="fb info">ยังเติมไม่ครบ อีก ' + miss + ' ช่อง</div>'; return; }
  var wrong = []; bl.forEach(function(p, i){ if(k.bank[st.fill[i]].t !== p.a) wrong.push(i); });
  if(!wrong.length){ st.done = true; st.bad = {}; st.fb = okBox(k.ok || ""); return; }
  st.fb = escalate(k, st, bl.length - wrong.length, bl.length);
  st.bad = {}; if(st.a >= 2) wrong.forEach(function(i){ st.bad[i] = true; });
}

/* ---- order : tap the steps in order */
function vOrder(k, st){
  var html = '<p class="small">แตะขั้นตอนจากด้านล่างเรียงจากแรกไปสุดท้าย แตะขั้นที่เลือกแล้วเพื่อเอาออก</p><ol class="seq">';
  for(var p = 0; p < k.steps.length; p++){
    var s = st.seq[p];
    if(s === undefined){ html += '<li class="slot empty"><span class="num">' + (p + 1) + '</span><span class="ct small">ขั้นที่ ' + (p + 1) + '</span></li>'; continue; }
    var cls = "card pick" + (st.done ? " good" : "") + (st.bad === p ? " wrong" : "");
    var note = st.bad === p ? '<span class="why">ขั้นนี้ยังไม่อยู่ในตำแหน่งที่ถูก' + (st.a >= 3 ? ' (ขั้นที่ ' + (p + 1) + ' ควรเป็น : ' + esc(k.steps[p]) + ')' : '') + '</span>' : '';
    html += '<li><button class="' + cls + '"' + (st.done ? ' disabled' : '') + ' data-x="unseq" data-i="' + p + '"><span class="num">' + (p + 1) + '</span><span class="ct">' + esc(k.steps[s]) + note + '</span></button></li>';
  }
  html += '</ol>';
  if(!st.done){
    html += '<div class="opts">';
    st.order.forEach(function(i){ if(st.seq.indexOf(i) >= 0) return; html += '<button class="card pick" data-x="seq" data-i="' + i + '"><span class="num empty"></span><span class="ct">' + esc(k.steps[i]) + '</span></button>'; });
    html += '</div>';
  }
  return html;
}
function checkOrder(k, st){
  if(st.seq.length < k.steps.length){ st.fb = '<div class="fb info">ยังเรียงไม่ครบ อีก ' + (k.steps.length - st.seq.length) + ' ขั้น</div>'; return; }
  var first = -1, right = 0; st.seq.forEach(function(s, p){ if(s === p) right++; else if(first < 0) first = p; });
  if(first < 0){ st.done = true; st.bad = -1; st.fb = okBox(k.ok || ""); return; }
  st.fb = escalate(k, st, right, k.steps.length);
  st.bad = st.a >= 2 ? first : -1;
}

/* ---- tf2 : true or false, then why */
function vTf2(k, st){
  var html = '<div class="panel claim">“' + esc(k.claim) + '”</div>';
  html += '<div class="bins tf">';
  [true, false].forEach(function(v){
    var tried = st.tfTried[v], chosen = st.phase > 0 && v === k.ans;
    html += '<button class="bin big' + (tried ? ' wrong' : '') + (chosen ? ' good' : '') + '"' + (tried || st.phase > 0 ? ' disabled' : '') + ' aria-pressed="' + chosen + '" data-x="tf" data-v="' + v + '">' + (v ? 'ถูก' : 'ผิด') + '</button>';
  });
  html += '</div>';
  if(st.tfTried[!k.ans]) html += '<div class="fb bad">ยังไม่ใช่ : ' + esc(k.tfFb) + '</div>';
  if(st.phase > 0) html += '<p class="q" style="font-size:18px">' + (k.ans ? 'ถูก' : 'ผิด') + ' เพราะอะไร</p>' + mcList(k.reasons, st, "tfr");
  return html;
}
/* ---- mc : one answer */
function mcList(opts, st, act){
  var html = '<div class="opts">', solved = st.picked !== null && opts[st.picked].ok;
  st.order.forEach(function(i){
    var o = opts[i], cls = "opt radio", dis = "", note = "";
    if(st.tried[i]){ cls += " wrong"; dis = " disabled"; note = '<span class="why">' + esc(o.fb) + '</span>'; }
    if(st.picked === i && o.ok){ cls += " good"; if(o.fb) note = '<span class="why">' + esc(o.fb) + '</span>'; }
    else if(solved) dis = " disabled";
    html += '<button class="' + cls + '"' + dis + ' data-x="' + act + '" data-i="' + i + '"><span class="box"></span><span>' + esc(o.t) + note + '</span></button>';
  });
  return html + '</div>';
}
function vMc(k, st){ return mcList(k.opts, st, "mc"); }
function pickMc(opts, i){
  var st = S.st;
  if(st.done) return;
  if(opts[i].ok){ st.picked = i; st.done = true; } else st.tried[i] = true;
  render();
  var nb = app.querySelector('[data-x="next"]'); if(nb) nb.focus();
}

/* ---- spot : tap every wrong sentence */
function vSpot(k, st){
  var nBad = k.lines.filter(function(l){ return l.bad; }).length;
  var html = '<p class="small">มีประโยคที่ผิด ' + nBad + ' ประโยค แตะเลือกให้ครบ แล้วกดตรวจ</p><div class="opts">';
  k.lines.forEach(function(l, i){
    var on = !!st.pick[i], cls = "opt", note = "";
    if(st.bad[i]){ cls += " wrong"; note = '<span class="why">' + (l.bad ? 'ประโยคนี้ผิด : ' + esc(l.fb) : 'ประโยคนี้ถูกแล้ว ไม่ต้องเลือก') + '</span>'; }
    if(st.done && l.bad){ cls += " good"; note = '<span class="why">ผิดเพราะ : ' + esc(l.fb) + '</span>'; }
    html += '<button class="' + cls + '"' + (st.done ? ' disabled' : '') + ' aria-pressed="' + on + '" data-x="spot" data-i="' + i + '"><span class="box">' + (on ? CHECK : '') + '</span><span>' + esc(l.t) + note + '</span></button>';
  });
  return html + '</div>';
}
function checkSpot(k, st){
  var wrong = [], right = 0;
  k.lines.forEach(function(l, i){ if(!!st.pick[i] === !!l.bad){ if(l.bad) right++; } else wrong.push(i); });
  if(!wrong.length){ st.done = true; st.bad = {}; st.fb = okBox(k.ok || "หาจุดผิดได้ครบ"); return; }
  var nBad = k.lines.filter(function(l){ return l.bad; }).length;
  st.fb = escalate(k, st, right, nBad);
  st.bad = {};
  if(st.a >= 2) wrong.forEach(function(i){ if(!k.lines[i].bad || st.a >= 3) st.bad[i] = true; });
  if(st.a === 2){ var missing = wrong.filter(function(i){ return k.lines[i].bad; }).length; if(missing) st.fb += '<div class="fb info">ยังหาไม่เจออีก ' + missing + ' ประโยค</div>'; }
}

/* ---- num : type a number */
function vNum(k, st){
  return '<div class="numrow"><input id="numin" class="numin" type="text" inputmode="decimal" autocomplete="off" aria-label="คำตอบ" value="' + esc(st.val) + '"' + (st.done ? ' disabled' : '') + '><span class="unit">' + esc(k.unit) + '</span></div>';
}
function checkNum(k, st){
  var raw = (st.val || "").replace(/,/g, "").trim(), v = parseFloat(raw);
  if(raw === "" || isNaN(v)){ st.fb = '<div class="fb info">พิมพ์ตัวเลขก่อนกดตรวจ</div>'; return; }
  if(Math.abs(v - k.ans) < 1e-9){ st.done = true; st.fb = okBox(k.ok); return; }
  st.tries++;
  var h = k.hints && k.hints[String(v)];
  var msg = '<div class="fb bad"><b>ยังไม่ใช่</b> ' + (h ? esc(h) : 'ลองคิดใหม่อีกครั้ง') + '</div>';
  if(!h && st.tries >= 2 && k.hint) msg += '<div class="fb info">คำใบ้ : ' + esc(k.hint) + '</div>';
  if(st.tries >= 3) msg += '<div class="fb info"><b>ดูเฉลย</b> คำตอบคือ ' + k.ans + ' ' + esc(k.unit) + ' : ' + esc(k.ok) + ' พิมพ์คำตอบนี้แล้วกดตรวจ</div>';
  st.fb = msg;
}

/* ---- moving on */
function check(){
  var k = task(), st = S.st;
  if(k.type === "sort") checkSort(k, st);
  else if(k.type === "match") checkMatch(k, st);
  else if(k.type === "cloze") checkCloze(k, st);
  else if(k.type === "order") checkOrder(k, st);
  else if(k.type === "spot") checkSpot(k, st);
  else if(k.type === "num") checkNum(k, st);
  render();
  var f = document.getElementById("fb"); if(f && f.firstChild) f.scrollIntoView({block:"nearest"});
  var nb = app.querySelector('[data-x="next"]'); if(nb) nb.focus({preventScroll:true});
}
function next(){
  var att = wrongCount(S.st), doneN = doneTasks() + 1;
  if(S.t < tasks().length - 1){ S.t++; initTask(); send("task", {done:doneN, att:att}); }
  else if(S.stage < 3){ S.stage++; S.t = 0; initTask(); send("task", {done:doneN, att:att}); }
  else { var d = load(DONE_KEY, {}); d[S.r.n] = { set:S.su.set, team:S.su.team }; save(DONE_KEY, d); S.stage = 4; send("finish", {stage:4, task:0, done:totalTasks(), att:att}); }

}

    '<div class="letter" aria-label="อักษร ' + ch + '">' + ch + '</div>' +
    '<p style="margin-top:14px"><b>จดอักษรนี้ไว้ ห้ามบอกเพื่อนห้องอื่น</b></p>' +
    '<div class="fb ok" style="text-align:left"><b>ประโยคของห้องนี้</b> (จดลงกระดาษโน้ต ใช้ตอนเขียนช่องของคุณบนบอร์ด)<br>' + esc(r.summary) + '</div>' +
    '<p>กลับไปที่ทีม เล่าห้องของคุณให้เพื่อนฟัง แล้วนำอักษรของทุกคนเรียงตามเลขบทบาท 1 ถึง 5 ไปเปิดตู้เวลาที่เครื่องครู</p>' +
    '<button class="btn ghost" data-x="chg">' + (S.chg ? 'ซ่อน' : 'เลือกชุดรหัสหรือทีมผิด? แตะเพื่อแก้') + '</button>' + (S.chg ? setupPicker() : '') +
    '<button class="btn ghost" data-x="again">' + (S.confirmAgain ? "แตะอีกครั้งเพื่อเริ่มห้องนี้ใหม่" : "เล่นห้องนี้ใหม่") + '</button></div>';
}
function again(){
  if(!S.confirmAgain){ S.confirmAgain = true; render(); return; }
  var d = load(DONE_KEY, {}); delete d[S.r.n]; save(DONE_KEY, d);
  S = { r:S.r, stage:0, t:0, seed:S.seed, st:null, confirmAgain:false, su:S.su, chg:false }; render(); focusTop();
}

/* ---- events (room pages) */
function roomClick(e){
  var b = e.target.closest("button"); if(!b || b.disabled) return;
  var x = b.getAttribute("data-x"), i = +b.getAttribute("data-i"), st = S.st, k = S.stage >= 1 && S.stage <= 3 ? task() : null;
  if(x === "start"){ if(!(S.su.set && S.su.team)) return; save(SETUP_KEY, S.su); S.stage = 1; S.t = 0; initTask(); send("start", {done:0}); render(); focusTop(); }
  else if(x === "pset" || x === "pteam"){
    var v = +b.getAttribute("data-v"); if(x === "pset") S.su.set = v; else S.su.team = v; S.su.date = today();
    if(S.stage === 4){ save(SETUP_KEY, S.su); var dd = load(DONE_KEY, {}); dd[S.r.n] = { set:S.su.set, team:S.su.team }; save(DONE_KEY, dd); send("finish", {stage:4, done:totalTasks()}); }
    render(); var nb = app.querySelector('[data-x="' + x + '"][data-v="' + v + '"]'); if(nb) nb.focus({preventScroll:true}); }
  else if(x === "chg"){ S.chg = !S.chg; render(); }
  else if(x === "sort"){ st.pick[i] = +b.getAttribute("data-v"); delete st.bad[i]; render(); var nb = app.querySelector('[data-x="sort"][data-i="' + i + '"][aria-pressed="true"]'); if(nb) nb.focus({preventScroll:true}); }
  else if(x === "ml") matchLeft(i);
  else if(x === "mr") matchRight(i);
  else if(x === "blank") clozeBlank(i);
  else if(x === "word") clozeWord(i);
  else if(x === "seq"){ st.seq.push(i); st.bad = -1; render(); }
  else if(x === "unseq"){ st.seq.splice(i, 1); st.bad = -1; render(); }
  else if(x === "spot"){ st.pick[i] = !st.pick[i]; delete st.bad[i]; render(); }
  else if(x === "tf"){ var v = b.getAttribute("data-v") === "true"; if(v === k.ans) st.phase = 1; else st.tfTried[v] = true; render(); }
  else if(x === "tfr") pickMc(k.reasons, i);
  else if(x === "mc") pickMc(k.opts, i);
  else if(x === "check") check();
  else if(x === "next") next();
  else if(x === "again") again();
}
function roomInput(e){ if(e.target.id === "numin" && S.st) S.st.val = e.target.value; }
function roomKey(e){ if(e.target.id === "numin" && e.key === "Enter"){ e.preventDefault(); check(); var n = document.getElementById("numin"); if(n && !n.disabled) n.focus(); } }

  app.onclick = boardClick; app.oninput = null; app.onkeydown = null;
  var html = '<div class="tvwrap">' +
    '<header class="tvbar"><div class="brand">' + ROCKET + '<span>ภารกิจตู้เวลา</span></div>' +
    '<h1 class="tvtitle">ตู้เวลา</h1>' +
    '<div class="tvctl"><label class="small" for="setsel">ชุดรหัส</label><select id="setsel" class="setsel">' +
    SETS_ENC.map(function(_, i){ return '<option value="' + (i + 1) + '"' + (B.set === i + 1 ? ' selected' : '') + '>' + (i + 1) + '</option>'; }).join("") +
    '</select><span id="live" class="live"></span></div></header>' +
    '<section id="grid" class="tvgrid" aria-label="ความคืบหน้ารายทีม"></section>' +
    '<section class="panel tvcode"><div class="tvcode-row"><div class="teams" id="teams"></div>' +
    '<input id="code" class="code" type="password" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="5" aria-label="รหัส 5 ตัวอักษร" placeholder="รหัส">' +
    '<button class="btn" data-b="open" style="width:auto;padding-inline:28px">เปิดตู้เวลา</button></div><div id="cmsg" aria-live="polite"></div></section>' +
    '<footer class="tvfoot"><button class="btn ghost" data-b="detail" id="detailbtn"></button><button class="btn ghost" data-b="new" id="newbtn"></button><a class="small" href="#">กลับหน้าห้องปริศนา</a></footer>' +
    '<div id="burst" class="burst" hidden></div></div>';
  app.innerHTML = html;
  document.getElementById("setsel").onchange = function(e){ B.set = +e.target.value; save("pr-board-set", B.set); B.rows = {}; B.srvCaps = []; drawAll(); poll(); };
  document.getElementById("code").addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); tryOpen(); } });
  drawAll();
  if(pollTimer) clearInterval(pollTimer);
  if(ENDPOINT){ poll(); pollTimer = setInterval(function(){ if((location.hash || "") !== "#capsule"){ clearInterval(pollTimer); pollTimer = null; return; } poll(); }, 5000); }
}
function localCaps(){ return load("pr-board-open", []).filter(function(o){ return o.set === B.set && o.ts >= B.since; }); }
function openedMap(){
  var m = {};
  B.srvCaps.concat(localCaps()).forEach(function(o){ if(!m[o.team] || o.ts < m[o.team]) m[o.team] = o.ts; });
  return m;
}
function drawAll(){ drawGrid(); drawTeams(); drawFoot(); drawLive(); }
function drawLive(){
  var el = document.getElementById("live"); if(!el) return;
  var t = { off:"ยังไม่ได้เชื่อม Google Sheet (ใช้ได้เฉพาะเปิดตู้เวลา)", wait:"กำลังเชื่อมต่อ…", ok:"สด · อัปเดตทุก 5 วินาที", err:"เชื่อมต่อไม่ได้ กำลังลองใหม่" }[B.online];
  el.className = "live " + B.online; el.textContent = t;
}
function drawFoot(){
  var d = document.getElementById("detailbtn"), n = document.getElementById("newbtn");
  if(d) d.textContent = B.detail ? "ซ่อนรายบทบาท (แสดงเฉพาะรายทีม)" : "แสดงรายบทบาท";
  if(n) n.textContent = B.confirmNew ? "แตะอีกครั้งเพื่อเริ่มคาบใหม่" : "เริ่มคาบใหม่ (ล้างกระดาน)";
}
function drawTeams(){
  var el = document.getElementById("teams"); if(!el) return;
  var om = openedMap(), h = "";
  for(var t = 1; t <= 5; t++) h += '<button class="team' + (om[t] ? " opened" : "") + '" aria-pressed="' + (B.team === t) + '" data-b="team" data-v="' + t + '">ทีม ' + t + '</button>';
  el.innerHTML = h;
}
function drawGrid(){
  var el = document.getElementById("grid"); if(!el) return;
  var om = openedMap(), h = "";
  for(var t = 1; t <= 5; t++){
    var roles = "", sum = 0, got = 0, any = false;
    for(var r = 1; r <= 5; r++){
      var row = B.rows[t + "-" + r], pct = 0, label = "ยังไม่เริ่ม", cls = "";
      if(row){
        any = true;
        pct = row.total ? Math.round(100 * row.done / row.total) : 0;
        if(row.stage >= 4 || row.ev === "finish"){ pct = 100; label = "เสร็จ ✓"; cls = " fin"; got++; }
        else label = "ด่าน " + row.stage + " (" + row.done + "/" + row.total + ")";
      }
      sum += pct;
      roles += '<li class="rl' + cls + '" style="--rc:' + ROLE_COL[r - 1] + '"><span class="rn">' + r + '</span><span class="rt">' + ROLE_SHORT[r - 1] + '<span class="rs">' + label + '</span></span>' +
        '<span class="rbar"><i style="width:' + pct + '%"></i></span></li>';
    }
    var tp = Math.round(sum / 5), open = om[t];
    h += '<article class="tcard' + (open ? " open" : "") + '"><div class="thead"><h2>ทีม ' + t + '</h2>' +
      (open ? '<span class="tbadge">เปิดตู้เวลาแล้ว ' + hhmm(open) + '</span>' : '<span class="tpct">' + (any || ENDPOINT ? tp + "%" : "") + '</span>') + '</div>' +
      '<div class="tbar"><i style="width:' + (open ? 100 : tp) + '%"></i></div>' +
      (B.detail ? '<ol class="roles">' + roles + '</ol>' : '<p class="tsum">ได้อักษรแล้ว ' + got + ' จาก 5 คน</p>') + '</article>';
  }
  el.innerHTML = h;
}
function poll(){
  if(!ENDPOINT || B.busy) return;
  B.busy = true;
  var url = ENDPOINT + (ENDPOINT.indexOf("?") >= 0 ? "&" : "?") + "set=" + B.set + "&since=" + B.since + "&_=" + Date.now();
  fetch(url).then(function(r){ return r.json(); }).then(function(j){
    if(!j || !j.ok) throw new Error("bad");
    var rows = {}; (j.rows || []).forEach(function(x){ rows[x.team + "-" + x.role] = x; });
    B.rows = rows; B.srvCaps = (j.caps || []).map(function(c){ return { team:c.team, ts:c.ts, set:B.set }; });
    B.online = "ok"; B.busy = false; drawGrid(); drawTeams(); drawLive();
  }).catch(function(){ B.busy = false; B.online = "err"; drawLive(); });
}
function boardClick(e){
  var b = e.target.closest("button"); if(!b) return;
  var a = b.getAttribute("data-b");
  if(a === "team"){ B.team = +b.getAttribute("data-v"); document.getElementById("cmsg").innerHTML = ""; drawTeams(); document.getElementById("code").focus(); }
  else if(a === "open") tryOpen();
  else if(a === "detail"){ B.detail = !B.detail; save("pr-board-detail", B.detail); drawGrid(); drawFoot(); }
  else if(a === "new"){
    if(!B.confirmNew){ B.confirmNew = true; drawFoot(); setTimeout(function(){ if(B){ B.confirmNew = false; drawFoot(); } }, 4000); return; }
    B.confirmNew = false; B.since = Date.now(); save("pr-board-since", B.since); B.rows = {}; B.srvCaps = []; B.team = 0;
    document.getElementById("cmsg").innerHTML = ""; drawAll(); poll();
  }
}
function tryOpen(){
  var inp = document.getElementById("code"), msg = document.getElementById("cmsg"), v = (inp.value || "").trim().toUpperCase();
  if(!B.team){ msg.innerHTML = '<div class="fb info">เลือกทีมก่อน</div>'; return; }
  if(v === setWord(B.set)){
    var list = load("pr-board-open", []), t = B.team, now = Date.now();
    if(!list.some(function(o){ return o.team === t && o.set === B.set && o.ts >= B.since; })){ list.push({ team:t, set:B.set, ts:now }); save("pr-board-open", list); }
    report({ ev:"capsule", set:B.set, team:t, role:0, stage:0, task:0, done:0, total:0, att:0 });
    inp.value = ""; B.team = 0; msg.innerHTML = "";
    drawGrid(); drawTeams(); burst(t);
  } else {
    msg.innerHTML = '<div class="fb bad"><b>รหัสยังไม่ถูก</b> ตรวจลำดับอักษรตามเลขบทบาท 1 ถึง 5 อีกครั้ง</div>';
    inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); inp.select();
  }
}
function burst(t){
  var el = document.getElementById("burst"); if(!el) return;
  el.innerHTML = '<div class="bcard"><div class="brocket">' + ROCKET + '</div><p class="bt">ทีม ' + t + '</p><p class="bs">เปิดตู้เวลาสำเร็จ กลับสู่ปัจจุบันแล้ว</p><p class="small">รับชุดภารกิจสุดท้ายจากครูได้เลย</p></div>';
  el.hidden = false;
  setTimeout(function(){ el.hidden = true; }, 4500);
  el.onclick = function(){ el.hidden = true; };
}


route();
})();
</script>
